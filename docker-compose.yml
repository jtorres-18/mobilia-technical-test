services:

  mysql:
    image: mysql:8.4
    container_name: mobilia-mysql

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: mobilia-backend

    environment:
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_R2DBC_USERNAME: ${MYSQL_USER}
      SPRING_R2DBC_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_FLYWAY_USER: ${MYSQL_USER}
      SPRING_FLYWAY_PASSWORD: ${MYSQL_PASSWORD}

      API_CONTRACTS_BASE_PATH: /api/v1/contracts
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api/v1

    container_name: mobilia-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  mysql_data: